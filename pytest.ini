[pytest]
# horseless-carriage is checked out as a git submodule inside this repo (the
# documented nested-install layout - see horseless-carriage/new_project.py).
# Its own agents/scrum_team/tests/ suite imports the `agents` package relative
# to the horseless-carriage checkout, which is never on sys.path when pytest
# is invoked (correctly) against this repo's root - left uncovered, a bare
# `pytest` run here recurses into it and aborts collection with
# "ModuleNotFoundError: No module named 'agents'" instead of running this
# project's own tests.
# addopts (not norecursedirs) so pytest's built-in default exclusions
# (.git, venv, node_modules, build, *.egg-info, ...) stay intact rather than
# being replaced wholesale.
addopts = --ignore=horseless-carriage
